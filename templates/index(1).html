<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🍅 Pomodoro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --work:  #7c3aed;
    --short: #059669;
    --long:  #2563eb;
    --bg:    #0f0f0f;
    --card:  #1a1a1a;
    --text:  #f5f5f5;
    --muted: #666;
    --border:#2a2a2a;
  }

  body {
    font-family: 'Space Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: #111;
    border-radius: 10px;
    padding: 4px;
    width: 100%;
  }

  .tab {
    flex: 1;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 6px 4px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 7px;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .03em;
  }
  .tab.active { background: var(--card); color: var(--text); }

  /* SVG ring */
  .ring-wrap { position: relative; width: 200px; height: 200px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  #ring-fg {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 565.5;
    transition: stroke-dashoffset .8s linear, stroke .3s;
  }
  #ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }

  .time-over {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  #time-display { font-size: 48px; font-weight: 700; letter-spacing: -2px; }
  #mode-label   { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

  /* Dots */
  .dots { display: flex; gap: 10px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--muted);
    background: transparent;
    transition: background .3s, border-color .3s;
  }
  .dot.done { background: var(--text); border-color: var(--text); }

  /* Buttons */
  .controls { display: flex; gap: 12px; align-items: center; }

  .btn-icon {
    width: 40px; height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    transition: background .15s, color .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon:hover { background: #222; color: var(--text); }

  .btn-main {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .1em;
    padding: 12px 32px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn-main:hover  { background: #222; }
  .btn-main:active { transform: scale(.97); }

  .stats {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
  }
  .stats b { color: var(--text); }
</style>
</head>
<body>
<div class="card">

  <div class="tabs">
    <button class="tab active" onclick="switchMode(0)">Фокус</button>
    <button class="tab"        onclick="switchMode(1)">Перерыв</button>
    <button class="tab"        onclick="switchMode(2)">Длинный</button>
  </div>

  <div class="ring-wrap">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle id="ring-bg" cx="100" cy="100" r="90"/>
      <circle id="ring-fg" cx="100" cy="100" r="90" stroke="#7c3aed" stroke-dashoffset="0"/>
    </svg>
    <div class="time-over">
      <div id="time-display">25:00</div>
      <div id="mode-label">Фокус</div>
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="btn-icon" onclick="reset()" title="Сброс">↺</button>
    <button class="btn-main" id="start-btn" onclick="toggle()">СТАРТ</button>
    <button class="btn-icon" onclick="skip()"  title="Пропустить">→</button>
  </div>

  <div class="stats">
    Сессий: <b id="s-count">0</b> &nbsp;|&nbsp; Фокус: <b id="s-focus">0 мин</b>
  </div>

</div>

<script>
const MODES = [
  { name: "Фокус",            secs: 25*60, color: "#7c3aed" },
  { name: "Короткий перерыв", secs:  5*60, color: "#059669" },
  { name: "Длинный перерыв",  secs: 15*60, color: "#2563eb" },
];
const CIRC = 2 * Math.PI * 90;   // 565.5

let modeIdx   = 0;
let remaining = MODES[0].secs;
let total     = MODES[0].secs;
let running   = false;
let interval  = null;
let sessions  = 0;
let focusSecs = 0;

const ringFg    = document.getElementById("ring-fg");
const timeEl    = document.getElementById("time-display");
const labelEl   = document.getElementById("mode-label");
const startBtn  = document.getElementById("start-btn");
const dotsEl    = document.getElementById("dots");
const sCount    = document.getElementById("s-count");
const sFocus    = document.getElementById("s-focus");
const tabs      = document.querySelectorAll(".tab");

function fmt(s) {
  const m = String(Math.floor(s/60)).padStart(2,"0");
  const sec = String(s%60).padStart(2,"0");
  return m+":"+sec;
}

function render() {
  const mode  = MODES[modeIdx];
  const ratio = remaining / total;
  timeEl.textContent  = fmt(remaining);
  labelEl.textContent = mode.name;
  ringFg.style.stroke = mode.color;
  ringFg.style.strokeDashoffset = CIRC * (1 - ratio);

  // dots
  const pos = sessions % 4;
  dotsEl.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < pos ? " done" : "");
    dotsEl.appendChild(d);
  }

  sCount.textContent = sessions;
  sFocus.textContent = Math.floor(focusSecs/60) + " мин";
}

function toggle() {
  if (running) {
    clearInterval(interval);
    running = false;
    startBtn.textContent = "СТАРТ";
  } else {
    running = true;
    startBtn.textContent = "ПАУЗА";
    interval = setInterval(() => {
      remaining--;
      if (modeIdx === 0) focusSecs++;
      if (remaining <= 0) expire();
      else render();
    }, 1000);
  }
}

function expire() {
  clearInterval(interval);
  running = false;
  startBtn.textContent = "СТАРТ";
  if (modeIdx === 0) {
    sessions++;
    switchMode(sessions % 4 === 0 ? 2 : 1);
  } else {
    switchMode(0);
  }
}

function reset() {
  clearInterval(interval);
  running = false;
  remaining = total;
  startBtn.textContent = "СТАРТ";
  render();
}

function skip() {
  clearInterval(interval);
  running = false;
  startBtn.textContent = "СТАРТ";
  if (modeIdx === 0) switchMode(sessions % 4 === 3 ? 2 : 1);
  else switchMode(0);
}

function switchMode(idx) {
  clearInterval(interval);
  running = false;
  modeIdx   = idx;
  total     = MODES[idx].secs;
  remaining = MODES[idx].secs;
  startBtn.textContent = "СТАРТ";
  tabs.forEach((t, i) => t.classList.toggle("active", i === idx));
  render();
}

render();
</script>
</body>
</html>
